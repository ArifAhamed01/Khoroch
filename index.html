<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b3d2e"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}</style><title>Khoroch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<style>
/* Concept: "tea garden". Clean cool-white app, khatas as soft pastel wallet cards, one deep tea-garden green
   for the hero and the settle-up card, jade for every action, gold only for the coin and travel routes.
   Ink roles: jade for actions and money coming back, red for money owed. Type scale 1.25: 13/16/20/25/31/39. */
:root{
  --bg:#f6f8f7;--surface:#ffffff;--sunk:#edf1ef;--fg:#0e1a16;--muted:#56645e;--line:#e2e8e5;
  --paper:#ffffff;--rule:#e9eeec;--margin:transparent;--khata:#0b3d2e;--khata-2:#062a20;--khata-fg:#ffffff;--khata-muted:#b9dccd;--gold:#ffc24a;
  --accent:#ffb020;--accent-2:#ffd27a;--accent-3:#c98100;--accent-fg:#241700;--accent-ink:#8a5a00;
  --primary:#087a55;--primary-2:#4cc79a;--primary-3:#05553b;--primary-fg:#ffffff;--primary-ink:#06704e;--line-strong:#8e9b95;
  --hero-a:#0f5a42;--hero-b:#062a20;--hero-fg:#f2fbf7;--hero-muted:#b9dccd;--globe:#8ce3bf;
  --pos:#06704e;--neg:#c42b33;--cat-l:36%;--scrim:rgba(4,20,15,.5);--tint-l:93%;--tint-s:62%;--tint-ink:30%;
  --shadow:0 1px 2px rgba(14,26,22,.04),0 2px 10px rgba(14,26,22,.04);
  --f-d:"Bricolage Grotesque","Hind Siliguri",system-ui,sans-serif;
  --f-b:"Hind Siliguri",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-n:"Bricolage Grotesque","Hind Siliguri",system-ui,sans-serif;
  --fs-s:.8125rem;--fs-b:1rem;--fs-m:1.25rem;--fs-l:1.5625rem;--fs-xl:1.953rem;--fs-xxl:2.441rem;
  --t-fast:120ms;--t-med:220ms;--ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1310;--surface:#121e19;--sunk:#192822;--fg:#e7f2ed;--muted:#9fb3aa;--line:#22332c;
  --paper:#121e19;--rule:#1f2e28;--margin:transparent;--khata:#0d4433;--khata-2:#072a20;--khata-fg:#ffffff;--khata-muted:#b9dccd;--gold:#ffc24a;
  --accent:#ffb020;--accent-2:#ffd27a;--accent-3:#c98100;--accent-fg:#241700;--accent-ink:#ffc24a;
  --primary:#1f9c71;--primary-2:#6fe0b5;--primary-3:#0b5c42;--primary-fg:#ffffff;--primary-ink:#5fd8a8;--line-strong:#53665e;
  --hero-a:#11553f;--hero-b:#05211a;--hero-fg:#f2fbf7;--hero-muted:#b9dccd;--globe:#8ce3bf;
  --pos:#5fd8a8;--neg:#ff7b81;--cat-l:70%;--scrim:rgba(0,0,0,.6);--tint-l:17%;--tint-s:28%;--tint-ink:72%;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.2);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1310;--surface:#121e19;--sunk:#192822;--fg:#e7f2ed;--muted:#9fb3aa;--line:#22332c;
  --paper:#121e19;--rule:#1f2e28;--margin:transparent;--khata:#0d4433;--khata-2:#072a20;--khata-fg:#ffffff;--khata-muted:#b9dccd;--gold:#ffc24a;
  --accent:#ffb020;--accent-2:#ffd27a;--accent-3:#c98100;--accent-fg:#241700;--accent-ink:#ffc24a;
  --primary:#1f9c71;--primary-2:#6fe0b5;--primary-3:#0b5c42;--primary-fg:#ffffff;--primary-ink:#5fd8a8;--line-strong:#53665e;
  --hero-a:#11553f;--hero-b:#05211a;--hero-fg:#f2fbf7;--hero-muted:#b9dccd;--globe:#8ce3bf;
  --pos:#5fd8a8;--neg:#ff7b81;--cat-l:70%;--scrim:rgba(0,0,0,.6);--tint-l:17%;--tint-s:28%;--tint-ink:72%;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.2);color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-b);font-size:1rem;line-height:1.5;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;min-height:40px}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
button{transition:opacity var(--t-fast) ease,background-color var(--t-med) ease,border-color var(--t-med) ease,transform var(--t-fast) ease}
button:active:not(:disabled){opacity:.72}
.fab:active,.btn:active:not(:disabled),.iconbtn:active{transform:scale(.97)}
button:disabled{cursor:default}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 128px;display:flex;flex-direction:column;gap:24px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-d);margin:0;text-wrap:balance;font-weight:700}
h2{font-size:var(--fs-m);letter-spacing:-.01em}
.muted{color:var(--muted)}.pos{color:var(--pos)}.neg{color:var(--neg)}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.eyebrow{font-size:var(--fs-b);font-weight:500;color:var(--muted)}
.pill{display:inline-flex;align-items:center;font-size:.78rem;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
section{display:flex;flex-direction:column;gap:12px}
.link{background:none;border:0;padding:10px 4px;color:var(--primary-ink);font-weight:600;font-size:1rem}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:28px;background:radial-gradient(120% 100% at 90% 0%,var(--hero-a),var(--hero-b) 70%);color:var(--hero-fg);padding:22px 20px 20px;min-height:230px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:var(--shadow)}
.hero canvas{position:absolute;right:-56px;top:-34px;width:300px;height:300px;touch-action:pan-y;cursor:grab}
.hero-txt{position:relative;max-width:15.5rem;pointer-events:none;display:flex;flex-direction:column;gap:6px}
.brand{font-family:var(--f-d);font-weight:700;font-size:.95rem;letter-spacing:.02em;color:var(--accent-2);display:flex;align-items:center;gap:8px}
.brand i{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:inset 0 0 0 3px var(--accent-2)}
.hero h1{font-size:var(--fs-xl);line-height:1.08;font-weight:800;letter-spacing:-.02em}
.hero p{margin:0;color:var(--hero-muted);font-size:.98rem}
.hero .btn-ghost{pointer-events:auto;align-self:flex-start;margin-top:6px;background:transparent;border:1px solid var(--hero-muted);color:var(--hero-fg);border-radius:999px;padding:10px 18px;font-weight:600;font-size:.95rem}

/* Book cards */
.books{display:flex;flex-direction:column;gap:12px;perspective:900px}
.book:active{transform:scale(.985)}
.book{--rx:0deg;--ry:0deg;position:relative;text-align:left;border:1px solid hsl(var(--h) 40% 50% / .14);border-radius:24px;padding:20px;display:grid;grid-template-columns:1fr auto;gap:8px 12px;
  color:var(--fg);background:hsl(var(--h) var(--tint-s) var(--tint-l));box-shadow:none;
  transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .25s ease;will-change:transform;min-width:0}
.book .pill{background:hsl(var(--h) 45% 50% / .14);color:hsl(var(--h) 55% var(--tint-ink))}
.book-name{font-family:var(--f-d);font-weight:700;font-size:var(--fs-m);min-width:0;overflow-wrap:anywhere;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.book-total{font-family:var(--f-n);font-weight:700;font-size:var(--fs-m);text-align:right}
.book-sub{grid-column:1/-1;font-size:.95rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.bar{grid-column:1/-1;height:8px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:4px}
.book .bar{background:hsl(var(--h) 40% 50% / .16);height:6px}.book .bar i{background:hsl(var(--h) 60% var(--tint-ink))}.book .bar i.over{background:var(--neg)}
.bar i{display:block;height:100%;border-radius:3px;background:var(--primary)}
.bar i.over{background:var(--neg)}
.starts{display:flex;flex-direction:column;gap:12px}
.start{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid hsl(var(--h) 40% 50% / .14);border-radius:24px;padding:20px;min-height:88px;
  color:var(--fg);background:hsl(var(--h) var(--tint-s) var(--tint-l));font-size:1rem}
.start b{font-family:var(--f-d);font-size:1.25rem}.start span{color:var(--muted)}
.start:active{transform:scale(.985)}
.empty{border:1px dashed var(--line-strong);border-radius:6px;padding:22px 18px;text-align:center;color:var(--muted);background:var(--surface)}

/* Book view */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);display:flex;align-items:center;gap:6px;padding-block:6px;margin-block:-6px}
.top h1{font-size:1.3rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.totals{display:flex;flex-direction:column;gap:4px}
.totals .big{font-size:var(--fs-xxl)}
.totals .sub{display:flex;flex-wrap:wrap;gap:2px 16px;color:var(--muted)}
.stat{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;min-width:0;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--f-n);font-weight:700;letter-spacing:-.01em;font-size:1.25rem;line-height:1.15;overflow-wrap:anywhere}
.stat span{font-size:.85rem;color:var(--muted)}
.big{font-family:var(--f-n);font-weight:800;font-size:var(--fs-xxl);line-height:1.05;letter-spacing:-.025em}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);padding:4px;border-radius:16px;gap:4px}
.tabs button,.seg button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:1rem;padding:12px 8px;min-height:46px;border-radius:9px}
.tabs button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.card{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:20px;overflow:hidden}
.card.ruled::before{content:none}
.settle{position:relative;background:radial-gradient(120% 120% at 100% 0%,var(--hero-a),var(--khata-2) 75%);color:var(--khata-fg);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px}

.settle h2{font-family:var(--f-b);font-size:var(--fs-l);font-weight:700;line-height:1.1}
.settle .sub{color:var(--khata-muted);font-size:.95rem;margin-top:-6px}
.settle .pays{color:var(--khata-muted)}
.xfer{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 12px;font-size:1.02rem}
.xfer+.xfer{border-top:1px solid rgba(255,255,255,.22);padding-top:12px}
.xfer .who{min-width:0;overflow-wrap:anywhere}
.xfer button{grid-column:1/-1;justify-self:start}
.xfer .amt{font-family:var(--f-n);font-weight:700;font-size:var(--fs-l);color:var(--gold)}
.xfer button{background:transparent;border:1px solid var(--khata-muted);color:var(--khata-fg);border-radius:999px;padding:8px 16px;min-height:44px;font-size:.92rem;font-weight:600}
.mrow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:14px 16px 14px 16px;border-top:1px solid var(--rule)}
.mrow:first-child{border-top:0}
.mrow .nm{font-weight:600;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0;overflow-wrap:anywhere}
.mrow .meta{font-size:.88rem;color:var(--muted)}
.mrow .net{grid-row:1/span 2;grid-column:2;text-align:right;align-self:center}
.mrow .net b{display:block;font-family:var(--f-n);font-weight:700;font-size:var(--fs-m)}
.mrow .net small{font-size:var(--fs-s);font-weight:600}
canvas.iso{width:100%;height:210px;display:block}
.pad{padding:14px 16px}
.card .tx:hover{background:color-mix(in srgb,var(--primary) 5%,var(--paper))}
.cat{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;background:hsl(var(--h) 70% 50% / .16);color:hsl(var(--h) 65% var(--cat-l))}
.catrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:10px 16px 10px 16px;border-top:1px solid var(--rule)}
.catrow:first-child{border-top:0}
.catrow .t{display:flex;flex-direction:column;gap:6px;min-width:0;font-size:1rem}
.catrow .track{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.catrow .track i{display:block;height:100%;border-radius:3px;background:hsl(var(--h) 65% 52%)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;min-height:42px;font-size:.95rem;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.day-head{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px 10px 16px;font-family:var(--f-d);font-size:var(--fs-b);font-weight:700;border-bottom:1px solid var(--rule);background:var(--sunk)}
.day-head .num{font-family:var(--f-n);color:var(--muted);font-weight:600}
.tx{display:grid;grid-template-columns:auto 1fr auto;gap:3px 12px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--rule);background:none;padding:14px 16px 14px 16px;font-size:1rem}
.day-head + .tx{border-top:0}
.tx .d{font-weight:500;min-width:0;overflow-wrap:anywhere}
.tx .a{font-weight:600;text-align:right}
.tx .s{grid-column:2/-1;font-size:.86rem;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.tx .cat{grid-row:1/span 2}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav b{font-family:var(--f-d);font-size:1.2rem}

.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px),calc(50vw - 282px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:20;border:0;border-radius:999px;background:var(--primary);color:var(--primary-fg);font-weight:600;font-family:var(--f-b);padding:16px 24px;min-height:56px;font-size:1.05rem;box-shadow:0 8px 24px rgba(8,122,85,.32)}

/* Sheets */
.scrim{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:600px;max-height:92%;max-height:92dvh;overscroll-behavior:contain;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;display:flex;flex-direction:column;gap:14px;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(18px,env(safe-area-inset-left,0px))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{background:none;border:0;font-size:1.9rem;line-height:1;color:var(--muted);min-width:46px;min-height:46px;padding:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);padding:3px;border-radius:12px;gap:3px}
.f{display:flex;flex-direction:column;gap:7px;font-size:.92rem;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{font-size:1rem;font-weight:400;color:var(--fg);background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:12px 14px;min-height:50px;width:100%;min-width:0}
textarea{min-height:120px;resize:vertical;font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.amount{font-family:var(--f-n);font-weight:700;font-size:2.1rem;padding:8px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{flex:1 1 auto;border:1.5px solid var(--line-strong);background:var(--surface);border-radius:12px;padding:12px 14px;min-height:50px;font-size:1rem;font-weight:600;color:var(--fg);min-width:0;overflow-wrap:anywhere}
.pick button[aria-pressed="true"]{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 14%,var(--surface));color:var(--fg)}
.rowin{display:grid;grid-template-columns:1fr 8.5rem;gap:10px;align-items:center;font-size:1rem;font-weight:500;color:var(--fg)}
.preview{background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:.95rem;display:flex;flex-direction:column;gap:4px;font-weight:400;color:var(--fg)}
.preview .r{display:flex;justify-content:space-between;gap:8px}
.mem{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
.step{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:2px}
.step button{width:42px;height:44px;border:0;background:none;font-size:1.2rem;font-weight:600}
.step b{min-width:1.6rem;text-align:center;color:var(--fg)}
.err{color:var(--neg);font-size:.95rem;min-height:1.1em;font-weight:500}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;border:0;border-radius:14px;padding:15px;min-height:54px;font-weight:700;font-size:1.05rem;background:var(--sunk);color:var(--fg)}
.btn.primary{background:var(--primary);color:var(--primary-fg)}
.btn.primary:disabled{opacity:.55}
.btn.danger{flex:0 0 auto;background:transparent;border:1.5px solid var(--neg);color:var(--neg);padding-inline:16px}
.confirm{background:color-mix(in srgb,var(--neg) 12%,var(--surface));border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:.9rem}
.opt{display:flex;gap:14px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:14px 16px;min-height:64px;width:100%;font-size:1rem}
.opt b{display:block}.opt span{font-size:.9rem;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);z-index:40;background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:1rem;white-space:nowrap}
.coin{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 130px);width:44px;height:44px;margin-left:-22px;z-index:41;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 35% 30%,var(--accent-2),var(--accent) 60%,var(--accent-3));box-shadow:inset 0 0 0 4px var(--accent-2),0 6px 14px rgba(0,0,0,.3)}

.scan{display:flex;flex-direction:column;gap:10px;background:var(--sunk);border-radius:16px;padding:12px}
.scan-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scan-btns button{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--line-strong);background:var(--surface);color:var(--fg);border-radius:12px;padding:10px;min-height:52px;font-weight:600;font-size:.95rem}
.rcpt{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center}
.thumb{width:64px;height:64px;border-radius:10px;overflow:hidden;border:0;padding:0;background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.found{display:flex;flex-direction:column;gap:6px;font-size:.95rem;min-width:0;overflow-wrap:anywhere}
.prog{height:6px;border-radius:3px;background:var(--surface);overflow:hidden}
.prog i{display:block;height:100%;background:var(--primary);border-radius:3px;transition:width .25s}
.alts{display:flex;flex-wrap:wrap;gap:6px}
.alts button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 14px;font-size:.92rem;font-weight:600}

<script>
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);

const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const iso10=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};

const addDays=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso10(d)};
const IN_ARTIFACT=!!window.claude;
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
function fmt(n,cur){const whole=["৳","₹","¥","रू"].includes(cur)||Math.abs(n%1)<.005;

function fmtP(n,cur){const f=Math.abs(n%1)>=.005;return cur+Number(n).toLocaleString(cur==="৳"||cur==="₹"||cur==="रू"?"en-IN":"en-US",{minimumFractionDigits:f?2:0,maximumFractionDigits:f?2:0})}
const short=v=>v>=100000?(v/100000).toFixed(1).replace(/\.0$/,"")+"L":v>=1000?(v/1000).toFixed(1).replace(/\.0$/,"")+"k":String(Math.round(v));

const ico=d=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>`;
const I={back:"M15 5l-7 7 7 7",share:"M12 15V4M8 8l4-4 4 4M5 13v6h14v-6",edit:"M4 20h4L19 9l-4-4L4 16z",plus:"M12 5v14M5 12h14",left:"M14 6l-6 6 6 6",right:"M10 6l6 6-6 6",
  copy:"M9 9h10v11H9zM5 15V4h10",file:"M7 3h7l4 4v14H7zM14 3v4h4",text:"M5 6h14M5 11h14M5 16h9",table:"M4 5h16v14H4zM4 10h16M10 5v14",inbox:"M12 4v10M8 10l4 4 4-4M4 16v4h16v-4",cam:"M4 8h3l2-3h6l2 3h3v11H4zM12 16.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z",up:"M12 16V5M8 9l4-4 4 4M4 15v5h16v-5",cloud:"M7 18h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.1 9.1 4.5 4.5 0 0 0 7 18z",user:"M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 20a8 8 0 0 1 16 0",people:"M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20a6.5 6.5 0 0 1 13 0M16 4.3a3.5 3.5 0 0 1 0 6.4M18 14.5a6.5 6.5 0 0 1 3.5 5.5"};

const CATS={food:["Food",22,"M7 3v7a2 2 0 0 0 4 0V3M9 12v9M17 3c-2.5 2-2.5 8 0 10v8"],
  transport:["Transport",215,"M4 16v-5l2-5h12l2 5v5M4 16h16M6.5 16v2.5M17.5 16v2.5M4 11h16"],
  stay:["Accommodation",265,"M3 19V6M3 13h18v6M7 13v-3h7a3 3 0 0 1 3 3"],

  bills:["Bills",195,"M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"],

  other:["Other",235,"M6 12h.01M12 12h.01M18 12h.01"]};

const catIco=c=>{const k=CATS[c]||CATS.other;return `<span class="cat" style="--h:${k[1]}">${ico(k[2])}</span>`};
const CURS=[["৳","BDT, Taka"],["₹","INR, Rupee"],["$","USD, Dollar"],["€","EUR, Euro"],["£","GBP, Pound"],["฿","THB, Baht"],["RM","MYR, Ringgit"],["रू","NPR, Rupee"],["AED","AED, Dirham"],["¥","JPY, Yen"]];

/* ---------- data ---------- */
const KEY="khoroch.v1";
let S=null;                         // {books:[], tx:[]}
let ui={view:"home",bookId:null,tab:"overview",filter:"All",month:today().slice(0,7),sheet:null,canInstall:null,isoData:{}};
let F=null,B=null;                  // form state: expense / book
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&Array.isArray(d.books)&&Array.isArray(d.tx))return d}}catch(e){}return null}
function save(){if(!save.quiet)syncSoon();try{localStorage.setItem(KEY,JSON.stringify(S,(k,v)=>k==="_v"?undefined:v));if(!save.asked&&navigator.storage&&navigator.storage.persist){save.asked=1;navigator.storage.persist().catch(()=>{})}}catch(e){toast("Couldn't save on this device")}}
const book=id=>S.books.find(b=>b.id===id);
const curBook=()=>book(ui.bookId);
const txOf=b=>S.tx.filter(t=>t.bookId===b.id);
const spent=l=>l.reduce((s,t)=>s+(t.kind==="settle"?0:+t.amount||0),0);
const heads=b=>b.members.reduce((s,m)=>s+(+m.heads||1),0);
const mname=(b,id)=>{const m=b.members.find(x=>x.id===id);return m?m.name:"Someone"};

/* ---------- maths ---------- */
function sharesOf(t,b){const sp=t.split||{mode:"heads"};
  if(sp.mode==="custom"){const o={};for(const k in sp.custom||{})o[k]=+sp.custom[k]||0;return o}
  const ids=b.members.map(m=>m.id),among=(sp.among&&sp.among.length?sp.among:ids).filter(i=>ids.includes(i));
  const w=id=>sp.mode==="heads"?(+b.members.find(m=>m.id===id).heads||1):1,tot=among.reduce((s,i)=>s+w(i),0)||1,o={};
  among.forEach(i=>o[i]=(+t.amount||0)*w(i)/tot);return o}
function summary(b){const paid={},share={},use={};b.members.forEach(m=>{paid[m.id]=0;share[m.id]=0;use[m.id]=0});let total=0;
  for(const t of txOf(b)){const a=+t.amount||0;
    if(t.kind==="settle"){if(t.from in paid)paid[t.from]+=a;if(t.to in share)share[t.to]+=a;continue}
    total+=a;for(const k in t.payers||{})if(k in paid)paid[k]+=+t.payers[k]||0;

  const net={};for(const k in paid)net[k]=paid[k]-share[k];return{paid,share,use,net,total}}
function transfers(net){const c=[],d=[];for(const k in net){const v=Math.round(net[k]);if(v>0)c.push([k,v]);else if(v<0)d.push([k,-v])}
  c.sort((a,b)=>b[1]-a[1]);d.sort((a,b)=>b[1]-a[1]);const out=[];let i=0,j=0;
  while(i<d.length&&j<c.length){const x=Math.min(d[i][1],c[j][1]);if(x>0)out.push({from:d[i][0],to:c[j][0],amount:x});d[i][1]-=x;c[j][1]-=x;if(!d[i][1])i++;if(!c[j][1])j++}
  return out}
function byCat(list){const o={};list.forEach(t=>{if(t.kind!=="settle")o[t.cat||"other"]=(o[t.cat||"other"]||0)+(+t.amount||0)});return Object.entries(o).sort((a,b)=>b[1]-a[1])}

/* ---------- views ---------- */
function home(){
  const HT=tabOrder().map(t=>HTABS[t]),has=t=>S.books.some(b=>b.type===t);
  if(!HT.some(h=>h[0]===ui.htab)){let v="";try{v=localStorage.getItem("khoroch.hometab")||""}catch(e){}ui.htab=HT.some(h=>h[0]===v)?v:""}
  if(!ui.htab||(!has(ui.htab)&&HT.some(h=>has(h[0]))&&!ui.htabPicked))ui.htab=(HT.find(h=>has(h[0]))||HT[0])[0];
  const shown=sortBooks(S.books.filter(b=>b.type===ui.htab));
  const cards=shown.map(b=>{const l=b.type==="personal"?ledgerTx(b):txOf(b),n=l.filter(t=>t.kind!=="settle").length;let total,sub,bar="";
    let cap="";
    if(b.type==="loan"){const L=loanSum(b),open=L.people.filter(p=>Math.abs(p.bal)>=.005),over=open.filter(p=>p.over).length;total=fmtP(L.owed,b.cur);cap="owed to you";
      sub=`<span class="${L.owe>0?"neg":""}">You owe ${fmtP(L.owe,b.cur)}</span><span>${open.length?open.length+(open.length===1?" open balance":" open balances"):n?"All settled":"No entries yet"}</span>${over?`<span class="neg">${over} past due</span>`:""}`}

    else{const m=today().slice(0,7),ms=spent(l.filter(t=>(t.date||"").startsWith(m)));total=fmt(ms,b.cur);cap="spent this month";
      sub=`<span>${n} entries in total</span>${b.budget?`<span>Budget ${fmt(b.budget,b.cur)}</span>`:""}`;
      if(b.budget)bar=`<div class="bar"><i class="${ms>b.budget?"over":""}" style="width:${Math.min(100,ms/b.budget*100).toFixed(1)}%"></i></div>`}
    if(b.type==="card"){const st=cardStats(b,0),c=st.c,o=cardOwed(b);total=c.nocount?fmtP(o.total,b.cur):`${st.count}<span class="of">/${c.target}</span>`;cap=c.nocount?"still to pay":"fee waiver";

function lendInfo(t){const m=S.tx.find(x=>x.link===t.id&&x.kind==="loan"),amt=+t.amount||0;if(!m)return{left:amt,repaid:0};const lb=S.books.find(x=>x.id===m.bookId);if(!lb)return{left:amt,repaid:0};

async function encode(obj){const bytes=new TextEncoder().encode(JSON.stringify(obj));
  if(window.CompressionStream)try{const z=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer());return "KH1Z:"+b64(z)}catch(e){}
  return "KH1:"+b64(bytes)}
async function decode(str){str=String(str).trim();if(str[0]==="{")return JSON.parse(str);
  const m=str.match(/KH1(Z?):([A-Za-z0-9+/=\s]+)/);if(!m)throw new Error("format");
  let u=Uint8Array.from(atob(m[2].replace(/\s/g,"")),c=>c.charCodeAt(0));
  if(m[1])u=new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());
  return JSON.parse(new TextDecoder().decode(u))}

  d.rects.forEach((r,i)=>{const ci=d.H?r.left+r.width/2:r.top+r.height/2;if(i>d.from&&c>ci)to=i;if(i<d.from&&c<ci&&to>=d.from)to=i});
