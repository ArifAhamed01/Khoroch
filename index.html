<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10143f"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}</style><title>Khoroch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first single column on an 8px rhythm. Indigo hero with a live 3D globe, flat bordered cards, bottom sheets for every form.
   Colour roles (UI/UX Pro Max, personal finance): trust blue for actions, green for money coming back, red for money owed, gold only for the brand coin. */
:root{
  --bg:#eef1f8;--surface:#ffffff;--sunk:#e4e9f4;--fg:#141a33;--muted:#5a6285;--line:#d3d9ea;
  --accent:#f2a516;--accent-2:#ffd071;--accent-3:#b87400;--accent-fg:#221600;--accent-ink:#8f5b00;
  --primary:#1d4ed8;--primary-2:#60a5fa;--primary-3:#1e3a8a;--primary-fg:#ffffff;--primary-ink:#1d4ed8;--line-strong:#8b93b3;
  --hero-a:#2b318c;--hero-b:#10143f;--hero-fg:#f4f5ff;--hero-muted:#b9bfeb;--globe:#aab4ff;
  --pos:#047857;--neg:#b91c1c;--cat-l:38%;--scrim:rgba(8,10,30,.55);
  --shadow:0 1px 2px rgba(20,26,51,.05),0 4px 14px rgba(20,26,51,.05);
  --f-d:"Bricolage Grotesque","Hind Siliguri",system-ui,sans-serif;
  --f-b:"Inter","Hind Siliguri",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-n:"Inter","Hind Siliguri",system-ui,sans-serif;
  --t-fast:120ms;--t-med:220ms;--ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0d22;--surface:#141936;--sunk:#1c2247;--fg:#eceffd;--muted:#98a1c8;--line:#283060;
  --accent:#ffb938;--accent-2:#ffe09a;--accent-3:#c98600;--accent-fg:#221600;--accent-ink:#ffc65c;
  --primary:#2563eb;--primary-2:#93c5fd;--primary-3:#1e40af;--primary-fg:#ffffff;--primary-ink:#93c5fd;--line-strong:#5c6699;
  --hero-a:#1d2370;--hero-b:#0c1030;--hero-fg:#f4f5ff;--hero-muted:#b9bfeb;--globe:#aab4ff;
  --pos:#34d399;--neg:#f87171;--cat-l:70%;--scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0d22;--surface:#141936;--sunk:#1c2247;--fg:#eceffd;--muted:#98a1c8;--line:#283060;
  --accent:#ffb938;--accent-2:#ffe09a;--accent-3:#c98600;--accent-fg:#221600;--accent-ink:#ffc65c;
  --primary:#2563eb;--primary-2:#93c5fd;--primary-3:#1e40af;--primary-fg:#ffffff;--primary-ink:#93c5fd;--line-strong:#5c6699;
  --hero-a:#1d2370;--hero-b:#0c1030;--hero-fg:#f4f5ff;--hero-muted:#b9bfeb;--globe:#aab4ff;
  --pos:#34d399;--neg:#f87171;--cat-l:70%;--scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25);color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-b);font-size:1rem;line-height:1.5;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;min-height:40px}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
button{transition:opacity var(--t-fast) ease,background-color var(--t-med) ease,border-color var(--t-med) ease,transform var(--t-fast) ease}
button:active:not(:disabled){opacity:.72}
.fab:active,.btn:active:not(:disabled),.iconbtn:active{transform:scale(.97)}
button:disabled{cursor:default}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 128px;display:flex;flex-direction:column;gap:24px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-d);margin:0;text-wrap:balance;font-weight:700}
h2{font-size:1.2rem}
.muted{color:var(--muted)}.pos{color:var(--pos)}.neg{color:var(--neg)}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.pill{display:inline-flex;align-items:center;font-size:.78rem;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}

section{display:flex;flex-direction:column;gap:12px}
.link{background:none;border:0;padding:10px 4px;color:var(--primary-ink);font-weight:600;font-size:1rem}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:24px;background:radial-gradient(120% 90% at 85% 10%,var(--hero-a),var(--hero-b));color:var(--hero-fg);padding:22px 20px 20px;min-height:230px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:var(--shadow)}
.hero canvas{position:absolute;right:-56px;top:-34px;width:300px;height:300px;touch-action:pan-y;cursor:grab}

.hero .btn-ghost{pointer-events:auto;align-self:flex-start;margin-top:6px;background:transparent;border:1px solid var(--hero-muted);color:var(--hero-fg);border-radius:999px;padding:10px 18px;font-weight:600;font-size:.95rem}

/* Book cards */
.books{display:flex;flex-direction:column;gap:12px;perspective:900px}
.book{--rx:0deg;--ry:0deg;text-align:left;border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;
  background:radial-gradient(150px 130px at 100% 0,hsl(var(--h) 85% 60% / .26),transparent 72%),var(--surface);box-shadow:var(--shadow);
  transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .25s ease;will-change:transform;min-width:0}
.book-name{font-family:var(--f-d);font-weight:700;font-size:1.2rem;min-width:0;overflow-wrap:anywhere;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.book-total{font-family:var(--f-n);font-weight:700;font-size:1.3rem;text-align:right}
.book-sub{grid-column:1/-1;font-size:.92rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.bar{grid-column:1/-1;height:8px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--primary)}
.bar i.over{background:var(--neg)}
.empty{border:1px dashed var(--line);border-radius:18px;padding:22px 18px;text-align:center;color:var(--muted);background:var(--surface)}

/* Book view */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);display:flex;align-items:center;gap:6px;padding-block:6px;margin-block:-6px}
.top h1{font-size:1.3rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats .stat:first-child{grid-column:1/-1}
.stats .stat:first-child b{font-size:1.7rem}
.stat{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;min-width:0;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--f-n);font-weight:700;letter-spacing:-.01em;font-size:1.25rem;line-height:1.15;overflow-wrap:anywhere}
.stat span{font-size:.85rem;color:var(--muted)}
.big{font-family:var(--f-n);font-weight:700;font-size:2.5rem;line-height:1;letter-spacing:-.02em}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);padding:3px;border-radius:12px;gap:3px}
.tabs button,.seg button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:1rem;padding:12px 8px;min-height:46px;border-radius:9px}
.tabs button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.card{border:1px solid var(--line);background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.settle{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:var(--hero-fg);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.settle .eyebrow{color:var(--hero-muted)}
.xfer{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.xfer{font-size:1.02rem}
.xfer .amt{font-family:var(--f-n);font-weight:700;font-size:1.35rem;margin-left:auto;color:var(--accent-2)}
.xfer button{background:transparent;border:1px solid var(--hero-muted);color:var(--hero-fg);border-radius:999px;padding:8px 16px;min-height:44px;font-size:.92rem;font-weight:600}
.mrow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:13px 16px;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .nm{font-weight:600;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0;overflow-wrap:anywhere}
.mrow .meta{font-size:.88rem;color:var(--muted)}
.mrow .net{grid-row:1/span 2;grid-column:2;text-align:right;align-self:center}
.mrow .net b{display:block;font-family:var(--f-n);font-size:1.2rem}
.mrow .net small{font-size:.76rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
canvas.iso{width:100%;height:210px;display:block}
.pad{padding:14px 16px}
.cat{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;background:hsl(var(--h) 70% 50% / .16);color:hsl(var(--h) 65% var(--cat-l))}
.catrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:10px 16px}
.catrow .t{display:flex;flex-direction:column;gap:6px;min-width:0;font-size:1rem}
.catrow .track{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.catrow .track i{display:block;height:100%;border-radius:3px;background:hsl(var(--h) 65% 52%)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;min-height:42px;font-size:.95rem;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.day-head{display:flex;justify-content:space-between;padding:11px 16px;background:var(--sunk);font-size:.92rem;font-weight:600}
.tx{display:grid;grid-template-columns:auto 1fr auto;gap:3px 12px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:14px 16px;font-size:1rem}
.day-head + .tx{border-top:0}
.tx .d{font-weight:500;min-width:0;overflow-wrap:anywhere}
.tx .a{font-weight:600;text-align:right}
.tx .s{grid-column:2/-1;font-size:.86rem;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.tx .cat{grid-row:1/span 2}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav b{font-family:var(--f-d);font-size:1.2rem}

.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:20;border:0;border-radius:999px;background:var(--primary);color:var(--primary-fg);font-weight:600;font-family:var(--f-b);padding:16px 24px;min-height:56px;font-size:1.05rem;box-shadow:0 6px 20px rgba(29,78,216,.35)}

/* Sheets */
.scrim{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:600px;max-height:92%;max-height:92dvh;overscroll-behavior:contain;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;display:flex;flex-direction:column;gap:14px;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(18px,env(safe-area-inset-left,0px))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{background:none;border:0;font-size:1.9rem;line-height:1;color:var(--muted);min-width:46px;min-height:46px;padding:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);padding:3px;border-radius:12px;gap:3px}
.f{display:flex;flex-direction:column;gap:7px;font-size:.92rem;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{font-size:1rem;font-weight:400;color:var(--fg);background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:12px 14px;min-height:50px;width:100%;min-width:0}
textarea{min-height:120px;resize:vertical;font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.amount{font-family:var(--f-n);font-weight:700;font-size:2.1rem;padding:8px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{flex:1 1 auto;border:1.5px solid var(--line-strong);background:var(--surface);border-radius:12px;padding:12px 14px;min-height:50px;font-size:1rem;font-weight:600;color:var(--fg);min-width:0;overflow-wrap:anywhere}
.pick button[aria-pressed="true"]{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 14%,var(--surface));color:var(--fg)}
.rowin{display:grid;grid-template-columns:1fr 8.5rem;gap:10px;align-items:center;font-size:1rem;font-weight:500;color:var(--fg)}
.preview{background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:.95rem;display:flex;flex-direction:column;gap:4px;font-weight:400;color:var(--fg)}
.preview .r{display:flex;justify-content:space-between;gap:8px}
.mem{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
.step{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:2px}
.step button{width:42px;height:44px;border:0;background:none;font-size:1.2rem;font-weight:600}
.step b{min-width:1.6rem;text-align:center;color:var(--fg)}
.err{color:var(--neg);font-size:.95rem;min-height:1.1em;font-weight:500}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;border:0;border-radius:14px;padding:15px;min-height:54px;font-weight:700;font-size:1.05rem;background:var(--sunk);color:var(--fg)}
.btn.primary{background:var(--primary);color:var(--primary-fg)}
.btn.primary:disabled{opacity:.55}
.btn.danger{flex:0 0 auto;background:transparent;border:1.5px solid var(--neg);color:var(--neg);padding-inline:16px}
.confirm{background:color-mix(in srgb,var(--neg) 12%,var(--surface));border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:.9rem}
.opt{display:flex;gap:14px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:14px 16px;min-height:64px;width:100%;font-size:1rem}
.opt b{display:block}.opt span{font-size:.9rem;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);z-index:40;background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:1rem;white-space:nowrap}
.coin{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 130px);width:44px;height:44px;margin-left:-22px;z-index:41;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 35% 30%,var(--accent-2),var(--accent) 60%,var(--accent-3));box-shadow:inset 0 0 0 4px var(--accent-2),0 6px 14px rgba(0,0,0,.3)}

.scan{display:flex;flex-direction:column;gap:10px;background:var(--sunk);border-radius:16px;padding:12px}
.scan-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scan-btns button{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--line-strong);background:var(--surface);color:var(--fg);border-radius:12px;padding:10px;min-height:52px;font-weight:600;font-size:.95rem}
.rcpt{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center}
.thumb{width:64px;height:64px;border-radius:10px;overflow:hidden;border:0;padding:0;background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.found{display:flex;flex-direction:column;gap:6px;font-size:.95rem;min-width:0;overflow-wrap:anywhere}
.prog{height:6px;border-radius:3px;background:var(--surface);overflow:hidden}
.prog i{display:block;height:100%;background:var(--primary);border-radius:3px;transition:width .25s}
.alts{display:flex;flex-wrap:wrap;gap:6px}
.alts button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 14px;font-size:.92rem;font-weight:600}
details summary{padding:6px 0;cursor:pointer}
pre.ocr{white-space:pre-wrap;word-break:break-word;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;max-height:220px;overflow:auto;background:var(--surface);color:var(--fg);padding:10px;border-radius:10px;margin:6px 0 0}
.filled{border-color:var(--primary)!important;background:color-mix(in srgb,var(--primary) 10%,var(--surface))!important}
.viewer{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.viewer .x{align-self:flex-end;color:#fff;margin:6px}
.viewer img{flex:1;min-height:0;width:100%;object-fit:contain}
.clip{width:14px;height:14px;vertical-align:-2px}
@media (prefers-reduced-motion: no-preference){
  .enter{animation:enter .38s cubic-bezier(.2,.8,.2,1)}
  @keyframes enter{from{opacity:.4;transform:perspective(900px) translateZ(-70px) rotateX(5deg)}to{opacity:1;transform:none}}
  .sheet{animation:up .26s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
  .coin{animation:coin .95s cubic-bezier(.3,.7,.3,1) forwards}
  @keyframes coin{0%{transform:perspective(400px) translateY(60px) rotateX(0) scale(.6);opacity:0}25%{opacity:1}70%{transform:perspective(400px) translateY(-70px) rotateX(900deg) scale(1.1);opacity:1}100%{transform:perspective(400px) translateY(-20px) rotateX(1080deg) scale(.9);opacity:0}}

}

</style>
</head><body>
<div class="wrap" id="app"></div>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);

function fmt(n,cur){const whole=["৳","₹","¥","रू"].includes(cur)||Math.abs(n%1)<.005;

const short=v=>v>=100000?(v/100000).toFixed(1).replace(/\.0$/,"")+"L":v>=1000?(v/1000).toFixed(1).replace(/\.0$/,"")+"k":String(Math.round(v));
const dayLabel=d=>{const x=new Date(d+"T00:00:00");return isNaN(x)?"No date":x.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})};
const monthLabel=m=>new Date(m+"-01T00:00:00").toLocaleDateString("en-GB",{month:"long",year:"numeric"});

let S=null;                         // {books:[], tx:[]}
let ui={view:"home",bookId:null,tab:"overview",filter:"All",month:today().slice(0,7),sheet:null,canInstall:null,isoData:{}};

function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&Array.isArray(d.books)&&Array.isArray(d.tx))return d}}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));if(!save.asked&&navigator.storage&&navigator.storage.persist){save.asked=1;navigator.storage.persist().catch(()=>{})}}catch(e){toast("Couldn't save on this device")}}
const book=id=>S.books.find(b=>b.id===id);
const curBook=()=>book(ui.bookId);
const txOf=b=>S.tx.filter(t=>t.bookId===b.id);
const spent=l=>l.reduce((s,t)=>s+(t.kind==="settle"?0:+t.amount||0),0);
const heads=b=>b.members.reduce((s,m)=>s+(+m.heads||1),0);
const mname=(b,id)=>{const m=b.members.find(x=>x.id===id);return m?m.name:"Someone"};

/* ---------- maths ---------- */
function sharesOf(t,b){const sp=t.split||{mode:"heads"};
  if(sp.mode==="custom"){const o={};for(const k in sp.custom||{})o[k]=+sp.custom[k]||0;return o}
  const ids=b.members.map(m=>m.id),among=(sp.among&&sp.among.length?sp.among:ids).filter(i=>ids.includes(i));
  const w=id=>sp.mode==="heads"?(+b.members.find(m=>m.id===id).heads||1):1,tot=among.reduce((s,i)=>s+w(i),0)||1,o={};
  among.forEach(i=>o[i]=(+t.amount||0)*w(i)/tot);return o}
function summary(b){const paid={},share={},use={};b.members.forEach(m=>{paid[m.id]=0;share[m.id]=0;use[m.id]=0});let total=0;
  for(const t of txOf(b)){const a=+t.amount||0;
    if(t.kind==="settle"){if(t.from in paid)paid[t.from]+=a;if(t.to in share)share[t.to]+=a;continue}
    total+=a;for(const k in t.payers||{})if(k in paid)paid[k]+=+t.payers[k]||0;
    const sh=sharesOf(t,b);for(const k in sh)if(k in share){share[k]+=sh[k];use[k]+=sh[k]}}
  const net={};for(const k in paid)net[k]=paid[k]-share[k];return{paid,share,use,net,total}}
function transfers(net){const c=[],d=[];for(const k in net){const v=Math.round(net[k]);if(v>0)c.push([k,v]);else if(v<0)d.push([k,-v])}
  c.sort((a,b)=>b[1]-a[1]);d.sort((a,b)=>b[1]-a[1]);const out=[];let i=0,j=0;
  while(i<d.length&&j<c.length){const x=Math.min(d[i][1],c[j][1]);if(x>0)out.push({from:d[i][0],to:c[j][0],amount:x});d[i][1]-=x;c[j][1]-=x;if(!d[i][1])i++;if(!c[j][1])j++}
  return out}
function byCat(list){const o={};list.forEach(t=>{if(t.kind!=="settle")o[t.cat||"other"]=(o[t.cat||"other"]||0)+(+t.amount||0)});return Object.entries(o).sort((a,b)=>b[1]-a[1])}

/* ---------- views ---------- */
function home(){
  const cards=S.books.map(b=>{const l=txOf(b),n=l.filter(t=>t.kind!=="settle").length;let total,sub,bar="";
    if(b.type==="trip"){const s=summary(b),x=transfers(s.net);total=fmt(s.total,b.cur);
      sub=`<span>${b.members.length} ${b.members.length===1?"member":"members"} · ${heads(b)} people</span><span>${n} expenses</span><span>${x.length?x.length+" to settle":n?"All settled":"No expenses yet"}</span>`}
    else{const m=today().slice(0,7),ms=spent(l.filter(t=>(t.date||"").startsWith(m)));total=fmt(ms,b.cur);
      sub=`<span>This month</span><span>${n} entries in total</span>${b.budget?`<span>Budget ${fmt(b.budget,b.cur)}</span>`:""}`;
      if(b.budget)bar=`<div class="bar"><i class="${ms>b.budget?"over":""}" style="width:${Math.min(100,ms/b.budget*100).toFixed(1)}%"></i></div>`}
    return `<button class="book" style="--h:${+b.hue||230}" data-a="open" data-id="${esc(b.id)}">
      <span class="book-name">${esc(b.name)} <span class="pill">${b.type==="trip"?"Trip":"Daily ledger"}</span>${b.sample?'<span class="pill">Sample</span>':""}</span>
      <span class="book-total num">${total}</span><span class="book-sub">${sub}</span>${bar}</button>`}).join("");
  return `<header class="hero"><canvas id="globe" aria-hidden="true"></canvas>
    <div class="hero-txt"><div class="brand"><i></i>Khoroch</div><h1>Split trips. Track every day.</h1><p>Works offline. Your data stays on this device.</p>
    ${ui.canInstall?'<button class="btn-ghost" data-a="install">Install app</button>':""}</div></header>
  <section><div class="sec-head"><h2>Your books</h2><button class="link" data-a="import">Import</button></div>
    <div class="books">${cards||'<div class="empty">No books yet. Tap <b>New</b> to start a trip or a daily ledger.</div>'}</div></section>
  <button class="fab" data-a="newbook">+ New</button>`}

function topbar(b){return `<div class="top"><button class="iconbtn" data-a="back" aria-label="Back">${ico(I.back)}</button><h1>${esc(b.name)}</h1>
  <button class="iconbtn" data-a="share" aria-label="Share or export">${ico(I.share)}</button><button class="iconbtn" data-a="editbook" aria-label="Edit">${ico(I.edit)}</button></div>`}
function catBlock(list,cur){const c=byCat(list),max=c.length?c[0][1]:1;
  return c.length?`<div class="card" style="padding-block:8px">${c.map(([k,v])=>`<div class="catrow" style="--h:${(CATS[k]||CATS.other)[1]}">${catIco(k)}<div class="t"><span>${catName(k)}</span><div class="track"><i style="width:${(v/max*100).toFixed(1)}%"></i></div></div><b class="num">${fmt(v,cur)}</b></div>`).join("")}</div>`:""}
function dayBlocks(list,b,row){const g={};list.forEach(t=>(g[t.date||""]=g[t.date||""]||[]).push(t));
  return Object.keys(g).sort().reverse().map(d=>{const it=g[d].sort((x,y)=>(x.created||0)-(y.created||0));
    return `<div class="card"><div class="day-head"><span>${dayLabel(d)}</span><span class="num">${fmt(spent(it),b.cur)}</span></div>${it.map(row).join("")}</div>`}).join("")}
function isoCard(id,title,vals,labels){ui.isoData[id]={vals,labels};
  return vals.some(v=>v>0)?`<section><h2>${title}</h2><div class="card pad"><canvas class="iso" data-iso="${id}" role="img" aria-label="${title}: ${labels.map((l,i)=>l+" "+Math.round(vals[i])).join(", ")}"></canvas></div></section>`:""}

function trip(b){const l=txOf(b),s=summary(b),x=transfers(s.net),exp=l.filter(t=>t.kind!=="settle"),h=heads(b);
  let body;
  if(ui.tab==="overview"){
    const days={};exp.forEach(t=>days[t.date]=(days[t.date]||0)+(+t.amount||0));const dk=Object.keys(days).sort().slice(-12);
    body=`<div class="settle"><div class="eyebrow">To settle up</div>${x.length?x.map(t=>`<div class="xfer"><span>${esc(mname(b,t.from))}</span><span style="opacity:.7">pays</span><span>${esc(mname(b,t.to))}</span><span class="amt num">${fmt(t.amount,b.cur)}</span><button data-a="paid" data-from="${esc(t.from)}" data-to="${esc(t.to)}" data-amt="${t.amount}">Mark paid</button></div>`).join(""):`<div>${exp.length?"Everyone is settled.":"Add the first expense to see who owes whom."}</div>`}</div>
    <section><h2>Balances</h2><div class="card">${b.members.map(m=>{const n=s.net[m.id],r=Math.round(n);
      return `<div class="mrow"><div class="nm">${esc(m.name)}${m.heads>1?`<span class="pill">${m.heads} people</span>`:""}</div>
      <div class="meta num">Paid ${fmt(s.paid[m.id],b.cur)} · share ${fmt(s.share[m.id],b.cur)}${m.heads>1?" · "+fmt(s.use[m.id]/m.heads,b.cur)+" each":""}</div>
      <div class="net num ${r>0?"pos":r<0?"neg":""}"><b>${fmt(Math.abs(n),b.cur)}</b><small>${r>0?"Gets back":r<0?"Owes":"Settled"}</small></div></div>`}).join("")}</div></section>
    ${isoCard("days","Spending by day",dk.map(k=>days[k]),dk.map(k=>new Date(k+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"})))}
    ${exp.length?`<section><h2>Where it went</h2>${catBlock(exp,b.cur)}</section>`:""}`}
  else{
    const cats=["All",...new Set(exp.map(t=>t.cat||"other")),...(l.some(t=>t.kind==="settle")?["paid"]:[])];if(!cats.includes(ui.filter))ui.filter="All";
    const shown=l.filter(t=>ui.filter==="All"||(ui.filter==="paid"?t.kind==="settle":t.kind!=="settle"&&(t.cat||"other")===ui.filter));
    body=`<div class="chips">${cats.map(c=>`<button class="chip" aria-pressed="${c===ui.filter}" data-a="filter" data-c="${c}">${c==="All"?"All":c==="paid"?"Paid back":catName(c)}</button>`).join("")}</div>
    ${shown.length?dayBlocks(shown,b,t=>{
      if(t.kind==="settle")return `<button class="tx" data-a="edittx" data-id="${esc(t.id)}"><span class="cat" style="--h:160">${ico("M5 12l5 5 9-10")}</span><span class="d">${esc(mname(b,t.from))} paid back ${esc(mname(b,t.to))}</span><span class="a num">${fmt(t.amount,b.cur)}</span><span class="s">${esc(t.note||"Settlement")}</span></button>`;
      const pk=Object.keys(t.payers||{}),sh=sharesOf(t,b),among=Object.keys(sh).filter(k=>sh[k]>0);
      const who=pk.length>1?pk.map(k=>esc(mname(b,k))+" "+fmt(t.payers[k],b.cur)).join(" + "):esc(mname(b,pk[0]));
      const how=among.length===1?"only "+esc(mname(b,among[0])):(among.length===b.members.length?"everyone":among.map(k=>esc(mname(b,k))).join(", "))+((t.split||{}).mode==="heads"?", per person":(t.split||{}).mode==="equal"?", equal":", custom");
      return `<button class="tx" data-a="edittx" data-id="${esc(t.id)}">${catIco(t.cat)}<span class="d">${esc(t.desc)}</span><span class="a num">${fmt(t.amount,b.cur)}</span><span class="s">Paid by ${who} · for ${how}${t.receipt?CLIP:""}</span></button>`})
    :`<div class="empty">${l.length?"Nothing in this filter.":"No expenses yet. Tap <b>Add expense</b> to log the first one."}</div>`}`}
  return `${topbar(b)}
  <div class="stats"><div class="stat"><b class="num">${fmt(s.total,b.cur)}</b><span>Total spent</span></div><div class="stat"><b class="num">${fmt(h?s.total/h:0,b.cur)}</b><span>Per person (${h})</span></div><div class="stat"><b class="num">${exp.length}</b><span>Expenses</span></div></div>
  <div class="tabs"><button aria-pressed="${ui.tab==="overview"}" data-a="tab" data-t="overview">Overview</button><button aria-pressed="${ui.tab==="log"}" data-a="tab" data-t="log">Expenses</button></div>
  ${body}<button class="fab" data-a="addtx">+ Add expense</button>`}

function ledger(b){const m=ui.month,l=txOf(b).filter(t=>(t.date||"").startsWith(m)),tot=spent(l),isNow=m===today().slice(0,7);
  const dim=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate(),dayN=isNow?+today().slice(8):dim,left=dim-dayN+1;
  const end=isNow?today():m+"-"+String(dim).padStart(2,"0"),ks=[...Array(7)].map((_,i)=>addDays(end,i-6)).filter(k=>k.startsWith(m)),per={};
  l.forEach(t=>per[t.date]=(per[t.date]||0)+(+t.amount||0));
  let budget="";
  if(b.budget){const rest=b.budget-tot;budget=`<div class="bar" style="height:8px"><i class="${rest<0?"over":""}" style="width:${Math.min(100,tot/b.budget*100).toFixed(1)}%"></i></div>
    <div class="muted num" style="font-size:.86rem">${rest>=0?fmt(rest,b.cur)+" left of "+fmt(b.budget,b.cur)+(isNow?" · about "+fmt(rest/left,b.cur)+" a day for "+left+(left===1?" day":" days"):""):fmt(-rest,b.cur)+" over the "+fmt(b.budget,b.cur)+" budget"}</div>`}
  return `${topbar(b)}
  <div class="monthnav"><button class="iconbtn" data-a="month" data-d="-1" aria-label="Previous month">${ico(I.left)}</button><b>${monthLabel(m)}</b><button class="iconbtn" data-a="month" data-d="1" aria-label="Next month">${ico(I.right)}</button></div>
  <section><div class="eyebrow">Spent ${isNow?"this month":"in "+monthLabel(m)}</div><div class="big num">${fmt(tot,b.cur)}</div>${budget}
    <div class="muted num" style="font-size:.86rem">${l.length} ${l.length===1?"entry":"entries"}${l.length?" · "+fmt(tot/dayN,b.cur)+" a day on average":""}</div></section>
  ${isoCard("week",isNow?"Last 7 days":"Last week of the month",ks.map(k=>per[k]||0),ks.map(k=>new Date(k+"T00:00:00").toLocaleDateString("en-GB",{weekday:"short"})))}
  ${l.length?`<section><h2>Where it went</h2>${catBlock(l,b.cur)}</section><section><h2>Entries</h2>${dayBlocks(l,b,t=>`<button class="tx" data-a="edittx" data-id="${esc(t.id)}">${catIco(t.cat)}<span class="d">${esc(t.desc)}</span><span class="a num">${fmt(t.amount,b.cur)}</span><span class="s">${catName(t.cat)}${t.note?" · "+esc(t.note):""}${t.receipt?CLIP:""}</span></button>`)}</section>`
    :`<div class="empty">Nothing logged in ${monthLabel(m)}. Tap <b>Add expense</b> to start.</div>`}
  <button class="fab" data-a="addtx">+ Add expense</button>`}

function render(nav){const b=curBook();if(ui.view!=="home"&&!b)ui.view="home";ui.isoData={};
  const el=$("#app");el.innerHTML=ui.view==="home"?home():b.type==="trip"?trip(b):ledger(b);
  el.classList.remove("enter");if(nav){void el.offsetWidth;el.classList.add("enter");scrollTo(0,0)}
  document.querySelectorAll("canvas[data-iso]").forEach(c=>{const d=ui.isoData[c.dataset.iso];if(d)iso(c,d.vals,d.labels)});
  drawGlobe(performance.now())}

/* ---------- sheets ---------- */
const pick=(items,sel,a)=>`<div class="pick">${items.map(m=>`<button type="button" data-a="${a}" data-id="${esc(m.id)}" aria-pressed="${Array.isArray(sel)?sel.includes(m.id):sel===m.id}">${esc(m.name)}</button>`).join("")}</div>`;
const head=t=>`<div class="sheet-head"><h2>${t}</h2><button class="x" data-a="close" aria-label="Close">×</button></div>`;
function txSheet(){const b=curBook(),trip=b.type==="trip",groups=b.members.some(m=>m.heads>1);
  const common=`<label class="f">Amount (${esc(b.cur)})<input class="amount num${F.filled&&F.filled.amount?" filled":""}" id="f-amount" data-f="amount" type="number" inputmode="decimal" min="0" step="any" placeholder="0" value="${esc(F.amount)}"></label>`;
  let h=head(F.id?"Edit entry":F.kind==="settle"?"Record a payback":"Add expense");
  if(trip&&!F.id)h+=`<div class="seg"><button data-a="kind" data-k="expense" aria-pressed="${F.kind==="expense"}">Expense</button><button data-a="kind" data-k="settle" aria-pressed="${F.kind==="settle"}">Paid back</button></div>`;
  if(F.kind==="settle"){h+=common+`<div class="f">Who paid it back?${pick(b.members,F.from,"from")}</div><div class="f">To whom?${pick(b.members,F.to,"to")}</div>
    <div class="grid2"><label class="f">Date<input id="f-date" data-f="date" type="date" value="${esc(F.date)}"></label><label class="f">Note<input id="f-note" data-f="note" placeholder="bKash, cash" maxlength="120" value="${esc(F.note)}"></label></div>`}
  else{h+=scanBlock()+common+`<label class="f">What was it for?<input class="${F.filled&&F.filled.desc?"filled":""}" id="f-desc" data-f="desc" placeholder="Lunch, CNG, boat fare" maxlength="120" value="${esc(F.desc)}"></label>
    <div class="f">Category<div class="chips">${Object.keys(CATS).map(c=>`<button type="button" class="chip" data-a="cat" data-c="${c}" aria-pressed="${F.cat===c}">${catName(c)}</button>`).join("")}</div></div>
    <label class="f">Date<input class="${F.filled&&F.filled.date?"filled":""}" id="f-date" data-f="date" type="date" value="${esc(F.date)}"></label>`;

const b64=u=>{let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
async function encode(obj){const bytes=new TextEncoder().encode(JSON.stringify(obj));
  if(window.CompressionStream)try{const z=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer());return "KH1Z:"+b64(z)}catch(e){}
  return "KH1:"+b64(bytes)}
async function decode(str){str=String(str).trim();if(str[0]==="{")return JSON.parse(str);
  const m=str.match(/KH1(Z?):([A-Za-z0-9+/=\s]+)/);if(!m)throw new Error("format");
  let u=Uint8Array.from(atob(m[2].replace(/\s/g,"")),c=>c.charCodeAt(0));
  if(m[1])u=new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());
  return JSON.parse(new TextDecoder().decode(u))}
const isDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||"");
const sid=s=>String(s).replace(/[^\w.\-:@+]/g,"").slice(0,40);
const numMap=o=>{const r={};if(o&&typeof o==="object")for(const k in o){const v=+o[k];if(isFinite(v))r[sid(k)]=v}return r};
function clean(d){if(!d||!Array.isArray(d.books))throw new Error("shape");

    hue:Math.round(+b.hue||230)%360,start:isDate(b.start)?b.start:"",end:isDate(b.end)?b.end:"",budget:Math.max(0,+b.budget||0),created:+b.created||Date.now(),
    members:(Array.isArray(b.members)?b.members:[]).filter(m=>m&&m.id).map(m=>({id:sid(m.id),name:String(m.name||"").slice(0,60),heads:Math.max(1,Math.min(99,Math.round(+m.heads||1)))}))}));
  const ids=new Set(books.map(b=>b.id));
  const tx=(Array.isArray(d.tx)?d.tx:[]).filter(t=>t&&ids.has(sid(t.bookId))&&isFinite(+t.amount)).map(t=>{const o={id:sid(t.id||uid()),bookId:sid(t.bookId),kind:t.kind==="settle"?"settle":"expense",amount:Math.abs(+t.amount),
      desc:String(t.desc||"").slice(0,160),cat:CATS[t.cat]?t.cat:"other",date:isDate(t.date)?t.date:today(),note:String(t.note||"").slice(0,200),created:+t.created||Date.now()};if(typeof t.receipt==="string"&&t.receipt)o.receipt=sid(t.receipt);
    if(o.kind==="settle"){o.from=sid(t.from||"");o.to=sid(t.to||"")}
    else if(t.payers){o.payers=numMap(t.payers);const sp=t.split||{};o.split={mode:["heads","equal","custom"].includes(sp.mode)?sp.mode:"heads"};
      if(o.split.mode==="custom")o.split.custom=numMap(sp.custom);else o.split.among=(Array.isArray(sp.among)?sp.among:[]).map(sid)}
    return o});
  return{books,tx}}

  if(b.type==="trip"){const s=summary(b),x=transfers(s.net);
    return `*${b.name}*\nTotal spent: ${fmt(s.total,b.cur)} (${fmt(s.total/(heads(b)||1),b.cur)} per person)\n\nTo settle up:\n${x.length?x.map(t=>`• ${mname(b,t.from)} pays ${mname(b,t.to)} ${fmt(t.amount,b.cur)}`).join("\n"):"• Everyone is settled"}\n\nBalances:\n${b.members.map(m=>{const r=Math.round(s.net[m.id]);return `• ${m.name}: paid ${fmt(s.paid[m.id],b.cur)}, share ${fmt(s.share[m.id],b.cur)}, ${r>0?"gets back "+fmt(r,b.cur):r<0?"owes "+fmt(-r,b.cur):"settled"}`}).join("\n")}`}

function csv(b){const q=v=>{v=String(v??"");if(/^[=+\-@]/.test(v))v="'"+v;return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v},t=b.type==="trip";
  const rows=[["Date","Type","Category","Description","Amount",...(t?["Paid by",...b.members.map(m=>m.name+" share")]:[]),"Note"]];
  txOf(b).sort((x,y)=>(x.date||"").localeCompare(y.date||"")||(x.created||0)-(y.created||0)).forEach(x=>{
    if(x.kind==="settle")rows.push([x.date,"Paid back","",mname(b,x.from)+" paid back "+mname(b,x.to),x.amount,mname(b,x.from),...b.members.map(()=>""),x.note]);
    else{const sh=t?sharesOf(x,b):{};rows.push([x.date,"Expense",catName(x.cat),x.desc,x.amount,...(t?[Object.keys(x.payers||{}).map(k=>mname(b,k)+(Object.keys(x.payers).length>1?" "+x.payers[k]:"")).join(" + "),...b.members.map(m=>Math.round((sh[m.id]||0)*100)/100)]:[]),x.note])}});
  return rows.map(r=>r.map(q).join(",")).join("\n")}

  F.removeReceipt=!!F.receipt;set(.02,"Opening the bill…");
  try{const pdf=/pdf/i.test(file.type)||/\.pdf$/i.test(file.name||"");if(file.size>25e6)throw new Error("too big");
    let canvas,text="";
    if(pdf){if(!window.pdfjsLib)await loadScript(PDFJS);pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_W;
      const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,page=await doc.getPage(1),v0=page.getViewport({scale:1}),vp=page.getViewport({scale:Math.min(3,1600/v0.width)});
      canvas=document.createElement("canvas");canvas.width=Math.round(vp.width);canvas.height=Math.round(vp.height);const cx=canvas.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,canvas.width,canvas.height);
      await page.render({canvasContext:cx,viewport:vp}).promise;text=pdfText(await page.getTextContent())}
    else canvas=await imgCanvas(file);
    const blob=await new Promise(r=>canvas.toBlob(r,"image/jpeg",.8));if(!alive())return;
    if(blob){if(F.newReceipt)URL.revokeObjectURL(F.newReceipt.url);F.newReceipt={blob,url:URL.createObjectURL(blob)}}
    if(text.replace(/\s/g,"").length<15){
      if(IN_ARTIFACT){F.scan={state:"error",msg:"Reading bills works in the installed app. The bill is attached."};drawSheet();return}
      OCR.cb=m=>{const p=+m.progress||0;if(m.status==="recognizing text")set(.15+.85*p,"Reading the bill… "+Math.round(p*100)+"%");else set(.04+.1*p,navigator.onLine===false?"Loading the bill reader…":"Loading the bill reader (first time needs internet)…")};
      set(.04,"Loading the bill reader…");if(!window.Tesseract)await loadScript(TESS);const w=await ocrWorker();if(!alive())return;
      const r=await w.recognize(canvas);text=(r&&r.data&&r.data.text)||""}
    OCR.cb=null;if(!alive())return;
    const found=parseBill(text);applyFound(found);F.scan={state:"done",found,alts:found.alts,text:text.trim()};drawSheet()}
  catch(e){OCR.cb=null;if(!alive())return;const msg=String(e&&e.message||e),att=F.newReceipt?" The bill is still attached.":"";
    F.scan={state:"error",msg:msg==="too big"?"That file is over 25 MB. Try a photo or a smaller PDF.":/load|fetch|network|script|import|wasm|failed/i.test(msg)?"Couldn't load the bill reader. Connect to the internet once, then it works offline."+att:"Couldn't read this file. Try a clearer photo, or enter the details below."+att};drawSheet()}}
function scanBlock(){const b=curBook(),sc=F.scan,has=F.newReceipt||(F.receipt&&!F.removeReceipt);
  if(!has&&!sc)return `<div class="scan"><div class="scan-btns"><button type="button" data-a="cam">${ico(I.cam)}Take photo</button><button type="button" data-a="upload">${ico(I.up)}Upload bill</button></div><span class="muted" style="font-size:.88rem">Snap or upload a bill, invoice or PDF to fill in the amount, date and shop.</span></div>`;
  const url=F.newReceipt?F.newReceipt.url:F.receiptUrl;let st;
  if(!sc)st="<span>Bill attached. Tap it to view.</span>";
  else if(sc.state==="busy")st=`<span id="scanmsg">${esc(sc.msg)}</span><div class="prog"><i id="scanbar" style="width:${Math.round(sc.progress*100)}%"></i></div>`;
  else if(sc.state==="done"){const f=sc.found,bits=[f.amount?fmt(f.amount,b.cur):"",f.date?dayLabel(f.date):"",f.merchant?esc(f.merchant):""].filter(Boolean);
    st=bits.length?`<span><b>Found</b> ${bits.join(" · ")}</span><span class="muted" style="font-size:.86rem">Check the highlighted fields before saving.</span>`:"<span>Couldn't find the total. Enter it below. The bill is still attached.</span>"}
  else st=`<span class="neg">${esc(sc.msg)}</span>`;
  let h=`<div class="scan"><div class="rcpt">${url?`<button type="button" class="thumb" data-a="viewrcpt" aria-label="View bill"><img src="${url}" alt=""></button>`:`<span class="thumb">${ico(I.file)}</span>`}<div class="found">${st}</div>${sc&&sc.state==="busy"?"<span></span>":'<button type="button" class="x" data-a="rmrcpt" aria-label="Remove bill">×</button>'}</div>`;
  if(sc&&sc.state==="done"&&sc.alts.length)h+=`<div class="f">${sc.found.amount?"Wrong total? Tap the right amount:":"Amounts on the bill:"}<div class="alts">${sc.alts.map(v=>`<button type="button" data-a="useamt" data-v="${v}">${fmt(v,b.cur)}</button>`).join("")}</div></div>`;
  if(sc&&sc.state==="done"&&sc.text)h+=`<details><summary class="muted" style="font-size:.88rem">Show the text it read</summary><pre class="ocr">${esc(sc.text)}</pre></details>`;
  if(!sc||sc.state!=="busy")h+=`<div class="scan-btns"><button type="button" data-a="cam">${ico(I.cam)}Retake</button><button type="button" data-a="upload">${ico(I.up)}Upload</button></div>`;
  return h+"</div>"}
